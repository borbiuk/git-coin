name: dependency-review

# Blocks a pull request that adds a dependency with a known high severity vulnerability or a license
# that is not on the list below. In practice this checks the weekly Dependabot pull requests.
# Needs the dependency graph turned on in the repository settings.
on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: dependency-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        runs-on: ubuntu-26.04
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Review the changed dependencies
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
                  # Development dependencies run in CI and on the maintainer's machine, so they count too
                  fail-on-scopes: runtime, development
                  # The licenses used by the current package-lock.json. A new license needs a deliberate addition.
                  allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, Python-2.0, PSF-2.0
