name: scorecard

# OpenSSF Scorecard: supply chain and repository hygiene checks, published to the Security tab.
# Scorecard accepts only this job shape for publishing results: read-only top-level permissions,
# the listed write scopes on the job, and its approved actions. Runs on the default branch only.
# Publishing needs a public repository.
on:
    branch_protection_rule:
    push:
        branches: [main]
    schedule:
        # Not at minute 0, the busiest time of the GitHub scheduler
        - cron: '23 3 * * 2'

permissions: read-all

jobs:
    analysis:
        # Forks cannot publish the results
        if: github.repository == 'borbiuk/git-coin'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            # Upload the results to the Security tab
            security-events: write
            # Publish the results to the OpenSSF API
            id-token: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run Scorecard
              uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
              with:
                  results_file: results.sarif
                  results_format: sarif
                  publish_results: true
            - name: Upload the results to the Security tab
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: results.sarif
