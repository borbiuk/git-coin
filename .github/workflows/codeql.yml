name: codeql

# Static security analysis of the TypeScript code and of the workflows themselves (script injection,
# permissions). This is the advanced setup: keep "Default setup" for code scanning turned off in the
# repository settings, otherwise GitHub rejects the results of this workflow.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Not at minute 0, the busiest time of the GitHub scheduler
        - cron: '41 4 * * 3'

permissions:
    contents: read

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        permissions:
            # Upload the results to the Security tab
            security-events: write
            contents: read
            actions: read

        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, actions]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  # JavaScript, TypeScript and workflow files need no build
                  build-mode: none
                  config-file: ./.github/codeql/codeql-config.yml
            - name: Analyze
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:${{ matrix.language }}
